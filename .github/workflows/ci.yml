name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install static analysis tools
        run: python -m pip install ruff==0.13.3 mypy==1.18.2
      - name: Run Ruff
        run: ruff check custom_components tests scripts
      - name: Run mypy
        run: mypy custom_components/linking_the_world_temp_ha

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Python syntax
        run: |
          python -m py_compile scripts/release_metadata.py tests/test_release_metadata.py tests/test_repository_surface.py
          find custom_components/linking_the_world_temp_ha -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Verify release metadata
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/release_metadata.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/release_metadata.py
          fi
      - name: Run repository contract tests
        run: python -m unittest -v tests.test_release_metadata tests.test_repository_surface

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            pytest_ha: pytest-homeassistant-custom-component==0.13.363
          - name: latest
            pytest_ha: pytest-homeassistant-custom-component
    name: Native tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native test dependencies
        run: |
          python -m pip install pytest-cov==7.1.0 "${{ matrix.pytest_ha }}"
      - name: Fresh Home Assistant install and reload smoke test
        run: pytest -q tests/native/test_setup.py tests/native/test_config_flow.py
      - name: Run native integration tests
        run: pytest -q --cov=custom_components.linking_the_world_temp_ha --cov-report=term-missing --cov-fail-under=95

  native-temperature-api:
    name: Native climate API (2026.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install HA Core independently of the pytest helper
        run: python -m pip install homeassistant==2026.11.1
      - name: Check real native temperature API and deprecation logs
        run: |
          python -c "from homeassistant.components.climate import ClimateEntity; assert hasattr(ClimateEntity, 'native_temperature_unit')"
          python -m unittest -v tests.test_climate_native_api
